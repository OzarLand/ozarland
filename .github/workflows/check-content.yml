name: check-content

# Runs the conventions checker that reviewers already run by hand
# (docs/review-policy.md), so outside pull requests get the same gate.
# It checks structure, links and sensitive data, not technical accuracy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content conventions, links and sensitive data
        run: python3 tools/check_content.py --root . $(git ls-files '*.md')
