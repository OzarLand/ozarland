name: Documentation
description: Something is wrong, missing or unclear in the documentation.
labels: ["type/docs", "status/triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page or path
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Audience
      options:
        - operator
        - contributor
        - decision-maker
  - type: checkboxes
    id: upstream
    attributes:
      label: Upstream check
      options:
        - label: This is specific to OzarLand. If it is true without OzarLand, it belongs in the upstream Kolla Ansible documentation.
