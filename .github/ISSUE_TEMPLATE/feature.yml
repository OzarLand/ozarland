name: Feature request
description: Propose a new capability.
labels: ["type/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator need
      description: Which operator task does this serve, in production? What happens today, and what does it cost?
    validations:
      required: true
  - type: textarea
    id: duplication
    attributes:
      label: Does Kolla Ansible (or an existing tool) already do this?
      description: |
        OzarLand uses Kolla Ansible as it is and never duplicates it.
        Link the documentation you checked, and explain why it does not cover the operator need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (including "documentation only")
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - deploy
        - images
        - upgrade
        - secrets
        - day2
        - lab
        - ci
        - governance
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable statements. Another contributor must be able to implement and verify from this issue alone.
