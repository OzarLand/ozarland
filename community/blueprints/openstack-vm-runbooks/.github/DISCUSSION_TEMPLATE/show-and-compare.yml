title: "[Compare] "
labels: ["kind/experience"]
body:
  - type: markdown
    attributes:
      value: |
        "Here is how we do X. How do you do it?" Describe your approach with its context, then ask. Different
        answers are the point; nobody has to be right.
  - type: textarea
    id: approach
    attributes:
      label: How you do it, and why
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      placeholder: "release, deployment method, scale, constraints"
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: What you would like to compare
