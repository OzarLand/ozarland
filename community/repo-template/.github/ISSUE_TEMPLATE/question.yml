name: Question
description: An operational question you want tracked until it is answered.
labels: ["kind/question", "status/open"]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended "has anyone seen this?", a **Q&A discussion** is usually better. Use this form when you
        want the question tracked and, once answered, turned into a page.
        **Never paste secrets, real hostnames, IP addresses, customer names or unredacted logs.**
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do or understand? What happens instead?
    validations:
      required: true
  - type: input
    id: releases
    attributes:
      label: OpenStack release(s)
      placeholder: "2025.1"
    validations:
      required: true
  - type: input
    id: components
    attributes:
      label: Components involved
      placeholder: "nova, neutron, ovn"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - kolla-ansible
        - openstack-ansible
        - charmed
        - vendor distribution
        - manual / other
        - not relevant
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment conditions that matter
      placeholder: "3 controllers, OVN, Ceph RBD, Ubuntu 24.04, ..."
  - type: textarea
    id: checked
    attributes:
      label: What you already checked
      description: Commands run and what they showed (redacted).
      render: shell
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: I removed secrets, hostnames, IP addresses, customer and person names from this issue.
          required: true
